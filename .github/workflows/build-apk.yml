name: Build ScreenFlow APK

# Permanent signing enabled

on:
  workflow_dispatch:
  push:
    branches: [main, "feature/player-0.5-windows-integration"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare permanent signing key
        env:
          SCREENFLOW_KEYSTORE_BASE64: ${{ secrets.SCREENFLOW_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SCREENFLOW_KEYSTORE_BASE64" ]; then
            printf '%s' "$SCREENFLOW_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > app/screenflow-release.keystore
          fi
      - name: Build APK
        env:
          SCREENFLOW_KEYSTORE_PATH: screenflow-release.keystore
          SCREENFLOW_KEYSTORE_PASSWORD: ${{ secrets.SCREENFLOW_KEYSTORE_PASSWORD }}
          SCREENFLOW_KEY_ALIAS: ${{ secrets.SCREENFLOW_KEY_ALIAS }}
          SCREENFLOW_KEY_PASSWORD: ${{ secrets.SCREENFLOW_KEY_PASSWORD }}
        run: |
          gradle test
          if [ -f app/screenflow-release.keystore ]; then
            gradle assembleRelease
          else
            gradle assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NarrowVision-Player-0.5.3-TEST-APK
          path: app/build/outputs/apk/**/*.apk

# Permanent ScreenFlow release signing
# Signing retry after secret correction
