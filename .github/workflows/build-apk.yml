name: Build ScreenFlow APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare permanent signing key
        if: ${{ secrets.SCREENFLOW_KEYSTORE_BASE64 != '' }}
        env:
          SCREENFLOW_KEYSTORE_BASE64: ${{ secrets.SCREENFLOW_KEYSTORE_BASE64 }}
        run: printf '%s' "$SCREENFLOW_KEYSTORE_BASE64" | base64 --decode > app/screenflow-release.keystore
      - name: Build signed updateable APK
        if: ${{ secrets.SCREENFLOW_KEYSTORE_BASE64 != '' }}
        env:
          SCREENFLOW_KEYSTORE_PATH: screenflow-release.keystore
          SCREENFLOW_KEYSTORE_PASSWORD: ${{ secrets.SCREENFLOW_KEYSTORE_PASSWORD }}
          SCREENFLOW_KEY_ALIAS: ${{ secrets.SCREENFLOW_KEY_ALIAS }}
          SCREENFLOW_KEY_PASSWORD: ${{ secrets.SCREENFLOW_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Build temporary test APK
        if: ${{ secrets.SCREENFLOW_KEYSTORE_BASE64 == '' }}
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: screenflow-player-apk
          path: app/build/outputs/apk/**/*.apk
