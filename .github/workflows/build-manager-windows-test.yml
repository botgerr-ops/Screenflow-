name: Build ScreenFlow Admin 0.8.3 TEST

on:
  push:
    branches:
      - feature/player-0.5-windows-integration
    paths:
      - manager-windows/**
      - .github/workflows/build-manager-windows-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-test:
    name: Build Windows TEST installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: manager-windows/src-tauri

      - name: Verify TEST version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --manifest-path manager-windows/src-tauri/Cargo.toml | ConvertFrom-Json
          $tauri = Get-Content manager-windows/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($metadata.packages[0].version -ne '0.8.3') { throw 'Cargo version is not 0.8.3' }
          if ($tauri.version -ne '0.8.3') { throw 'Tauri version is not 0.8.3' }

      - name: Install test dependencies
        working-directory: manager-windows/tests
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        working-directory: manager-windows/tests
        run: npm test

      - name: Build NSIS installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: manager-windows
          args: --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFlow-Admin-0.8.3-TEST-windows
          path: manager-windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
