name: Build ScreenFlow Admin Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, "feature/player-0.5-windows-integration" ]
    paths:
      - "manager-windows/**"
      - ".github/workflows/build-manager-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: manager-windows/src-tauri
      - name: Build Windows installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: manager-windows
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ScreenFlow-Admin-Windows
          path: |
            manager-windows/src-tauri/target/release/bundle/nsis/*.exe
            manager-windows/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
