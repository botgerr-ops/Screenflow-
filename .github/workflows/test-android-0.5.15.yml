name: NarrowVision Android 0.5.15 TEST signed validation
on:
  push:
    branches: [fix/test-android-image-identity-0.5.15]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enforce TEST scope and fail-closed identity behavior
        run: |
          set -eu
          grep -Fq 'versionCode = 23' app/build.gradle.kts
          grep -Fq 'versionName = "0.5.15-test"' app/build.gradle.kts
          grep -Fq 'bqapbwsvfofgnfogwhdx.supabase.co' app/build.gradle.kts
          ! grep -Eq 'eckmifmgrurxgriimgpp' app/build.gradle.kts
          grep -Fq 'identity.isRecoveryRequired()' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'identity.hasPriorRegistration()' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'SampledImages.decode(' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'ImageSampleSize.calculate(' app/src/main/java/nl/screenflow/player/SampledImages.java
          grep -Fq 'setRequireUserAction(PackageInstaller.SessionParams.USER_ACTION_NOT_REQUIRED)' app/src/main/java/nl/screenflow/player/OtaUpdater.java
          ! grep -Fq '.remove("device_uid")' app/src/main/java/nl/screenflow/player/PlayerIdentityStore.java
          echo 'PASS: TEST boundaries, stable UID, sampling and untouched OTA installer'
      - name: Restore permanent release signing
        env:
          SCREENFLOW_KEYSTORE_BASE64: ${{ secrets.SCREENFLOW_KEYSTORE_BASE64 }}
        run: |
          test -n "$SCREENFLOW_KEYSTORE_BASE64"
          printf '%s' "$SCREENFLOW_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > app/screenflow-release.keystore
          test -s app/screenflow-release.keystore
      - name: Unit tests and signed release
        env:
          SCREENFLOW_KEYSTORE_PATH: screenflow-release.keystore
          SCREENFLOW_KEYSTORE_PASSWORD: ${{ secrets.SCREENFLOW_KEYSTORE_PASSWORD }}
          SCREENFLOW_KEY_ALIAS: ${{ secrets.SCREENFLOW_KEY_ALIAS }}
          SCREENFLOW_KEY_PASSWORD: ${{ secrets.SCREENFLOW_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$SCREENFLOW_KEYSTORE_PASSWORD" && test -n "$SCREENFLOW_KEY_ALIAS" && test -n "$SCREENFLOW_KEY_PASSWORD"
          gradle --no-daemon test assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SIGNER="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' | sort -V | tail -1)"
          "$SIGNER" verify --print-certs "$APK"
          sha256sum "$APK" > apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NarrowVision-Player-0.5.15-TEST-Signed-Candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk.sha256
          retention-days: 30
