name: NarrowVision Android 0.5.16 TEST signed validation
on:
  push:
    branches: [fix/test-image-seamless-transition-0.5.16]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enforce TEST-only version and seamless transition guards
        run: |
          set -eu
          grep -Fq 'versionCode = 24' app/build.gradle.kts
          grep -Fq 'versionName = "0.5.16-test"' app/build.gradle.kts
          grep -Fq 'bqapbwsvfofgnfogwhdx.supabase.co' app/build.gradle.kts
          ! grep -Eq 'eckmifmgrurxgriimgpp' app/build.gradle.kts
          grep -Fq 'incoming.setImageBitmap(decoded)' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'retiredImage=outgoing' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'generation!=imageGeneration' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'android.intent.action.MY_PACKAGE_REPLACED' app/src/main/AndroidManifest.xml
          grep -Fq 'Intent.ACTION_MY_PACKAGE_REPLACED' app/src/main/java/nl/screenflow/player/BootReceiver.java
          ! grep -Fq '.remove("device_uid")' app/src/main/java/nl/screenflow/player/PlayerIdentityStore.java
      - name: Restore permanent release signing
        env:
          SCREENFLOW_KEYSTORE_BASE64: ${{ secrets.SCREENFLOW_KEYSTORE_BASE64 }}
        run: |
          test -n "$SCREENFLOW_KEYSTORE_BASE64"
          printf '%s' "$SCREENFLOW_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > app/screenflow-release.keystore
          test -s app/screenflow-release.keystore
      - name: Unit tests and signed release
        env:
          SCREENFLOW_KEYSTORE_PATH: screenflow-release.keystore
          SCREENFLOW_KEYSTORE_PASSWORD: ${{ secrets.SCREENFLOW_KEYSTORE_PASSWORD }}
          SCREENFLOW_KEY_ALIAS: ${{ secrets.SCREENFLOW_KEY_ALIAS }}
          SCREENFLOW_KEY_PASSWORD: ${{ secrets.SCREENFLOW_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$SCREENFLOW_KEYSTORE_PASSWORD" && test -n "$SCREENFLOW_KEY_ALIAS" && test -n "$SCREENFLOW_KEY_PASSWORD"
          gradle --no-daemon test assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SIGNER="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' | sort -V | tail -1)"
          "$SIGNER" verify --print-certs "$APK"
          sha256sum "$APK" > apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NarrowVision-Player-0.5.16-TEST-Signed-Candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk.sha256
          retention-days: 30
