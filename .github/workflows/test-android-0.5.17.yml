name: NarrowVision Android 0.5.17 TEST OEM OTA validation
on:
  push:
    branches: [fix/test-prodvx-ota-relaunch-0.5.17]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: TEST-only, auth and signing invariants
        run: |
          set -eu
          grep -Fq 'versionCode = 25' app/build.gradle.kts
          grep -Fq 'versionName = "0.5.17-test"' app/build.gradle.kts
          grep -Fq 'bqapbwsvfofgnfogwhdx.supabase.co' app/build.gradle.kts
          ! grep -Eq 'eckmifmgrurxgriimgpp' app/build.gradle.kts
          grep -Fq 'ProDvxApi.installAndRun(' app/src/main/java/nl/screenflow/player/OtaUpdater.java
          grep -Fq 'verifyApk(apk, target)' app/src/main/java/nl/screenflow/player/OtaUpdater.java
          grep -Fq 'runAfterInstall=true' app/src/main/java/nl/screenflow/player/ProDvxApi.java
          ! grep -Fq 'rebootDevice' app/src/main/java/nl/screenflow/player/ProDvxApi.java
          ! grep -Fq 'ProDVXapi' app/src/main/java/nl/screenflow/player/ProDvxApi.java
          grep -Fq 'AndroidKeyStore' app/src/main/java/nl/screenflow/player/ProDvxTokenStore.java
          grep -Fq '<base-config cleartextTrafficPermitted="false"' app/src/main/res/xml/network_security_config.xml
          ! grep -Fq '.remove("device_uid")' app/src/main/java/nl/screenflow/player/PlayerIdentityStore.java
      - name: Restore permanent release signing
        env:
          SCREENFLOW_KEYSTORE_BASE64: ${{ secrets.SCREENFLOW_KEYSTORE_BASE64 }}
        run: |
          set -eu
          test -n "$SCREENFLOW_KEYSTORE_BASE64"
          printf '%s' "$SCREENFLOW_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > app/screenflow-release.keystore
          test -s app/screenflow-release.keystore
      - name: Unit tests and signed TEST APK
        env:
          SCREENFLOW_KEYSTORE_PATH: screenflow-release.keystore
          SCREENFLOW_KEYSTORE_PASSWORD: ${{ secrets.SCREENFLOW_KEYSTORE_PASSWORD }}
          SCREENFLOW_KEY_ALIAS: ${{ secrets.SCREENFLOW_KEY_ALIAS }}
          SCREENFLOW_KEY_PASSWORD: ${{ secrets.SCREENFLOW_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$SCREENFLOW_KEYSTORE_PASSWORD" && test -n "$SCREENFLOW_KEY_ALIAS" && test -n "$SCREENFLOW_KEY_PASSWORD"
          gradle --no-daemon test assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SIGNER="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' | sort -V | tail -1)"
          "$SIGNER" verify --print-certs "$APK"
          sha256sum "$APK" > apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NarrowVision-Player-0.5.17-TEST-OEM-OTA-Signed-Candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk.sha256
          retention-days: 30
