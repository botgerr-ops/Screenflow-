name: TEST Android 0.5.8 autostart signed APK
on:
  push:
    branches:
      - feature/test-android-boot-autostart
    paths:
      - app/**
      - .github/workflows/test-autostart-apk.yml
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate version, package and manifest
        run: |
          grep -Fq 'applicationId = "nl.screenflow.player"' app/build.gradle.kts
          grep -Fq 'versionCode = 16' app/build.gradle.kts
          grep -Fq 'versionName = "0.5.8-test"' app/build.gradle.kts
          grep -Fq 'android.permission.RECEIVE_BOOT_COMPLETED' app/src/main/AndroidManifest.xml
          grep -Fq 'android:name=".BootReceiver"' app/src/main/AndroidManifest.xml
          grep -Fq 'android.intent.action.BOOT_COMPLETED' app/src/main/AndroidManifest.xml
      - name: Recover existing permanent TEST signing key
        env:
          SCREENFLOW_KEYSTORE_BASE64: ${{ secrets.SCREENFLOW_KEYSTORE_BASE64 }}
        run: |
          test -n "$SCREENFLOW_KEYSTORE_BASE64" || { echo 'Permanent keystore missing: refusing to publish nonupgradeable APK'; exit 1; }
          printf '%s' "$SCREENFLOW_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > app/screenflow-release.keystore
          test -s app/screenflow-release.keystore
      - name: Test and build signed release
        env:
          SCREENFLOW_KEYSTORE_PATH: screenflow-release.keystore
          SCREENFLOW_KEYSTORE_PASSWORD: ${{ secrets.SCREENFLOW_KEYSTORE_PASSWORD }}
          SCREENFLOW_KEY_ALIAS: ${{ secrets.SCREENFLOW_KEY_ALIAS }}
          SCREENFLOW_KEY_PASSWORD: ${{ secrets.SCREENFLOW_KEY_PASSWORD }}
        run: |
          test -n "$SCREENFLOW_KEYSTORE_PASSWORD" && test -n "$SCREENFLOW_KEY_ALIAS" && test -n "$SCREENFLOW_KEY_PASSWORD" || { echo 'Signing config incomplete'; exit 1; }
          gradle test assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          SIGNER="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' | sort -V | tail -1)"
          test -x "$SIGNER"
          "$SIGNER" verify app/build/outputs/apk/release/app-release.apk
          echo 'PASS: TEST version 0.5.8 compiled, unit tests passed and APK signature verified; physical reboot still required.'
      - uses: actions/upload-artifact@v4
        with:
          name: NarrowVision-Player-0.5.8-TEST-Autostart
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
