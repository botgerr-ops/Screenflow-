name: TEST boot registration (no APK publish)
on:
  push:
    branches: [feature/test-android-boot-autostart]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify boot intent, receiver and correct fullscreen target
        run: |
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.BOOT_COMPLETED' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".BootReceiver"' app/src/main/AndroidManifest.xml
          grep -q 'FullscreenActivity.class' app/src/main/java/nl/screenflow/player/BootReceiver.java
          grep -q 'android:name=".FullscreenActivity"' app/src/main/AndroidManifest.xml
      - name: Compile and run Android tests
        run: gradle test assembleDebug
