name: TEST Android 0.5.11 unattended OTA signed APK
on:
  push:
    branches:
      - release/test-ota-unattended-0.5.11
    paths:
      - app/**
      - .github/workflows/test-ota-policy.yml
  workflow_dispatch:
jobs:
  signed-ota-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify separate TEST version and unattended installer requirements
        run: |
          grep -Fq 'applicationId = "nl.screenflow.player"' app/build.gradle.kts
          grep -Fq 'versionCode = 19' app/build.gradle.kts
          grep -Fq 'versionName = "0.5.11-test"' app/build.gradle.kts
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION' app/src/main/AndroidManifest.xml
          grep -Fq 'android:name=".OtaInstallReceiver"' app/src/main/AndroidManifest.xml
          grep -Fq 'params.setRequireUserAction(PackageInstaller.SessionParams.USER_ACTION_NOT_REQUIRED)' app/src/main/java/nl/screenflow/player/OtaUpdater.java
          if grep -Fq 'params.setRequireUserAction(PackageInstaller.SessionParams.USER_ACTION_REQUIRED)' app/src/main/java/nl/screenflow/player/OtaUpdater.java; then echo 'Unexpected forced installer confirmation'; exit 1; fi
          grep -Fq 'canRequestPackageInstalls()' app/src/main/java/nl/screenflow/player/OtaUpdater.java
          grep -Fq 'verifyApk(apk, target)' app/src/main/java/nl/screenflow/player/OtaUpdater.java
          grep -Fq 'STATUS_PENDING_USER_ACTION' app/src/main/java/nl/screenflow/player/OtaInstallReceiver.java
      - name: Restore existing permanent TEST signing key
        env:
          SCREENFLOW_KEYSTORE_BASE64: ${{ secrets.SCREENFLOW_KEYSTORE_BASE64 }}
        run: |
          test -n "$SCREENFLOW_KEYSTORE_BASE64" || { echo 'Missing permanent signing key'; exit 1; }
          printf '%s' "$SCREENFLOW_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > app/screenflow-release.keystore
          test -s app/screenflow-release.keystore
      - name: Unit tests and signed release build
        env:
          SCREENFLOW_KEYSTORE_PATH: screenflow-release.keystore
          SCREENFLOW_KEYSTORE_PASSWORD: ${{ secrets.SCREENFLOW_KEYSTORE_PASSWORD }}
          SCREENFLOW_KEY_ALIAS: ${{ secrets.SCREENFLOW_KEY_ALIAS }}
          SCREENFLOW_KEY_PASSWORD: ${{ secrets.SCREENFLOW_KEY_PASSWORD }}
        run: |
          test -n "$SCREENFLOW_KEYSTORE_PASSWORD" && test -n "$SCREENFLOW_KEY_ALIAS" && test -n "$SCREENFLOW_KEY_PASSWORD"
          gradle --no-daemon test assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          SIGNER="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' | sort -V | tail -1)"
          test -x "$SIGNER"
          "$SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk | tee apk.sha256
      - name: Upload signed TEST candidate and checksum (no device rollout)
        uses: actions/upload-artifact@v4
        with:
          name: NarrowVision-Player-0.5.11-TEST-Unattended-Candidate
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk.sha256
          retention-days: 30
