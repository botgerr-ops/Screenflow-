name: TEST Android OTA policy (no install or deployment)
on:
  push:
    branches:
      - feature/test-android-ota-0.5.8
    paths:
      - app/**
      - .github/workflows/test-ota-policy.yml
  workflow_dispatch:
jobs:
  ota-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reject accidental package or release baseline changes
        run: |
          grep -Fq 'applicationId = "nl.screenflow.player"' app/build.gradle.kts
          grep -Fq 'versionCode = 16' app/build.gradle.kts
          grep -Fq 'versionName = "0.5.8-test"' app/build.gradle.kts
          grep -Fq 'nv-player-releases/' app/src/main/java/nl/screenflow/player/OtaUpdatePolicy.java
      - name: Run JVM unit tests and compile Android APK (never publish)
        run: |
          gradle test assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo 'PASS: OTA validation tests and debug build; no release signed, installed, or deployed.'
