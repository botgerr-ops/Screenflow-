name: TEST revoked player cache and overnight scheduling
on:
  push:
    branches: [feature/test-player-revocation-cache-isolation]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check that revocation isolates cache, state and pairing
        run: |
          grep -q 'secure_reset_pending' app/src/main/java/nl/screenflow/player/PlayerIdentityStore.java
          grep -q 'narrowvision_player_state' app/src/main/java/nl/screenflow/player/PlayerIdentityStore.java
          grep -q 'narrowvision_player_media' app/src/main/java/nl/screenflow/player/PlayerIdentityStore.java
          grep -q 'requireResetComplete' app/src/main/java/nl/screenflow/player/PlayerIdentityStore.java
          grep -q 'previous' app/src/main/java/nl/screenflow/player/ScheduleLogic.java
          grep -q 'android.permission.RECEIVE_BOOT_COMPLETED' app/src/main/AndroidManifest.xml
      - name: Run unit tests and compile debug without distributing
        run: gradle test assembleDebug
