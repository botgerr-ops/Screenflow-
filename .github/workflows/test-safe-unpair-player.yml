name: TEST Android 0.5.14 safe unpair signed APK
on:
  push:
    branches: [feature/test-customer-safe-unpair-0.5.14]
  workflow_dispatch:
jobs:
  safe-unpair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Guard current working OTA installer and TEST version
        run: |
          grep -Fq 'versionCode = 22' app/build.gradle.kts
          grep -Fq 'versionName = "0.5.14-test"' app/build.gradle.kts
          grep -Fq 'PackageInstaller.SessionParams.USER_ACTION_NOT_REQUIRED' app/src/main/java/nl/screenflow/player/OtaUpdater.java
          grep -Fq 'playbackAuthorized=false;stopPlaybackImmediately();clearTenantContent()' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'if(!playbackAuthorized)return' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'cache.clearAll()' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'state.load()!=null' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'clearRejectedIdentity()' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'api.heartbeat(0,false,null,true)' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'response.optBoolean("unpair_requested",false)' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'stopped.await(5,TimeUnit.SECONDS)' app/src/main/java/nl/screenflow/player/MainActivity.java
          grep -Fq 'unpair_ack' app/src/main/java/nl/screenflow/player/PlayerApiClient.java
          grep -Fq 'current_playlist_id = null' supabase/functions/player-heartbeat/index.ts
          grep -Fq 'pairing_state_changed' supabase/functions/player-heartbeat/index.ts
          git diff --exit-code origin/release/test-ota-unattended-0.5.12 HEAD -- app/src/main/java/nl/screenflow/player/OtaUpdater.java app/src/main/java/nl/screenflow/player/OtaInstallReceiver.java app/src/main/AndroidManifest.xml
      - name: Restore permanent signing key
        env:
          SCREENFLOW_KEYSTORE_BASE64: ${{ secrets.SCREENFLOW_KEYSTORE_BASE64 }}
        run: |
          test -n "$SCREENFLOW_KEYSTORE_BASE64"
          printf '%s' "$SCREENFLOW_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > app/screenflow-release.keystore
          test -s app/screenflow-release.keystore
      - name: Unit tests and signed release APK
        env:
          SCREENFLOW_KEYSTORE_PATH: screenflow-release.keystore
          SCREENFLOW_KEYSTORE_PASSWORD: ${{ secrets.SCREENFLOW_KEYSTORE_PASSWORD }}
          SCREENFLOW_KEY_ALIAS: ${{ secrets.SCREENFLOW_KEY_ALIAS }}
          SCREENFLOW_KEY_PASSWORD: ${{ secrets.SCREENFLOW_KEY_PASSWORD }}
        run: |
          test -n "$SCREENFLOW_KEYSTORE_PASSWORD" && test -n "$SCREENFLOW_KEY_ALIAS" && test -n "$SCREENFLOW_KEY_PASSWORD"
          gradle --no-daemon test assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          SIGNER="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' | sort -V | tail -1)"
          "$SIGNER" verify --print-certs "$APK"
          sha256sum "$APK" > apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: NarrowVision-Player-0.5.14-TEST-Safe-Unpair
          path: |
            app/build/outputs/apk/release/app-release.apk
            apk.sha256
          retention-days: 30
