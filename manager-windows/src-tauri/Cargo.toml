[package]
name = "screenflow-manager"
version = "0.9.0"
description = "NarrowVision Admin voor Windows"
authors = ["NarrowVision"]
edition = "2021"

[lib]
name = "screenflow_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
base64 = "0.22"
