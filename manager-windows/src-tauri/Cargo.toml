[package]
name = "screenflow-manager"
version = "0.3.2"
description = "ScreenFlow Manager voor Windows"
authors = ["ScreenFlow"]
edition = "2021"

[lib]
name = "screenflow_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
